services:
    website:
        image: nginx
        ports:
        - "8081:80"
        restart: always
        networks:
            TTide:
                ipv4_address: 192.168.92.20
    website2:
        image: nginx
        ports:
        - "8082:80"
        restart: always
        networks:
            TTide:
                ipv4_address: 192.168.92.21

networks:
  TTide:
    ipam:
      driver: default
      config:
        - subnet: "192.168.92.0/24"
