services:
  db:
    container_name: TTide-Post2
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    ports:
      - "5432:5432"
#    volumes:
#      - pgdata:/var/lib/postgresql/data

  pgadmin:
    container_name: pgadmin4-Post2
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
        PGADMIN_DEFAULT_EMAIL: admin@admin.container.com
        PGADMIN_DEFAULT_PASSWORD: root
    ports:
     - "5050:80"

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

#volumes:
#  pgdata:
